<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>whoami — Frontend Intern</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1115'/%3E%3Ctext x='32' y='42' font-family='monospace' font-size='30' font-weight='700' fill='%235eead4' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="terminal" role="main">
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <p class="path">intern@zyroo:~/week-01</p>
    </div>

    <div class="screen">
      <div class="avatar-row">
        <div class="avatar" id="avatar">
          <img src="avatar.jpg" alt="Profile photo" />
        </div>
        <div class="intro-text">
          <p class="prompt">$ whoami</p>
          <h1 id="typed-name"></h1>
          <p class="role">Frontend Development Intern @ Zyroo</p>
        </div>
      </div>

      <p class="bio">
        Week 1 checkpoint. This page confirms HTML, CSS and JavaScript are wired up
        correctly before the real project work starts in Week 2.
      </p>

      <div class="log" id="log" aria-live="polite">
        <p class="log-line dim">// console is quiet — run the check below</p>
      </div>

      <div class="actions">
        <button id="run-btn" class="btn">▶ Run environment check</button>
        <span class="status" id="status"></span>
      </div>
    </div>

    <div class="footer-bar">
      <span>index.html</span>
      <span>style.css</span>
      <span>script.js</span>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
